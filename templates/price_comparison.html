{% extends 'base.html' %}
{% block body %}

<div class="card text-center">
<h2><b>PRICE COMPARISON TOOL</b></h2>
<p><B>Enter a product name to find the best price.</B></p>
<form method="POST" style="margin-top: 1.5rem;">
<input type="text" name="product" placeholder="e.g., iPhone 14 Pro" required>
<button type="submit" class="btn">COMPARE PRICES</button>
</form>
</div>

<div class="text-center" style="margin-top: 2rem;">
<a href="{{ url_for('dashboard') }}" class="btn btn-secondary" style="width: auto;">Return to Dashboard</a>
</div>
{% endblock %}
